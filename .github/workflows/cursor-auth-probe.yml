# One-off probe: does CURSOR_API_KEY authenticate cursor-agent on a CI runner?
#
# Local testing could not answer this. Pointing HOME at a temp dir to hide the
# logged-in session (~/.cursor/cli-config.json) also hid the macOS keychain,
# and the CLI died with "Keychain operation timed out" while caching the
# session — after the key itself had already passed validation. A Linux runner
# has no macOS keychain, so the only honest test is the real thing.
#
# Deliberately manual-dispatch only. This job holds a secret, and a public
# repository must never expose one to a workflow that untrusted input can
# trigger. No `pull_request`, and never `pull_request_target`.
#
# Delete this file once the answer is recorded in docs/roadmap.md.
name: cursor-auth-probe

on:
  workflow_dispatch:

permissions:
  contents: read # the probe reads the checkout; it must not be able to push

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install Cursor CLI
        run: |
          curl https://cursor.com/install -fsS | bash
          # The docs say ~/.cursor/bin; this host installed to ~/.local/bin.
          # Add both rather than betting on either.
          echo "$HOME/.cursor/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Show CLI version
        run: cursor-agent --version

      # A fresh runner has no logged-in session, so this should fail. If it
      # somehow succeeds, the next step proves nothing about the key.
      - name: 'CONTROL: no key — expected to FAIL'
        id: control
        continue-on-error: true
        run: |
          cursor-agent -p --mode ask --trust "Reply with exactly: OK"

      - name: 'CONTROL verdict'
        run: |
          if [ "${{ steps.control.outcome }}" = "success" ]; then
            echo "::error::Runner has ambient auth without a key — the subject test would be meaningless."
            exit 1
          fi
          echo "OK: no ambient auth on the runner. The key is the only variable."

      # The actual question.
      - name: 'SUBJECT: with CURSOR_API_KEY — expected to PASS'
        env:
          # Scoped to this step only. A job-level or workflow-level env would
          # hand the key to every step, including ones with no need for it.
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: |
          test -n "$CURSOR_API_KEY" || { echo "::error::secret CURSOR_API_KEY is not set on this repo"; exit 1; }
          cursor-agent -p --mode ask --trust "Reply with exactly: OK"

      # `--model auto` makes daily cost unpredictable. Capture what this account
      # can actually select so the pipeline can pin one.
      - name: List available models
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: cursor-agent --list-models

      # Generation needs write + shell, not just Q&A. Prove that path works
      # headlessly too, at negligible cost.
      - name: 'SUBJECT: write path (-p --force)'
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: |
          cursor-agent -p --force --trust \
            "Create a file named probe-ok.txt in the workspace root containing exactly: hello. Do nothing else."
          echo "--- result ---"
          test -f probe-ok.txt && cat probe-ok.txt || echo "NO FILE WRITTEN"
