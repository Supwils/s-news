# Cloud twin of .githooks/pre-push: validate:news (layout + content) + lint + test.
#
# Why this exists when the local hook runs the same command: the hook validates
# the *working tree*, not the commit being pushed. With work in progress on disk
# — the normal state of this repo — it reports on files that are not in the
# push. On 2026-07-24 it reported 77 passing tests while the pushed tree held
# 71; six of them lived in a file that was never committed. This job is the only
# thing that tests what actually deploys. It also covers `git push --no-verify`,
# pushes from a machine without the hook installed, and future contributors.
#
# Why only the gate and not `next build`: Vercel builds every push anyway, and a
# broken build fails the deploy — the live site keeps serving the previous
# version. Duplicating the build here would double the wall time for no extra
# protection. What Vercel does NOT run is lint and the test suite; this does.
#
# Why `paths-ignore: NEWS/**`: the daily content push touches nothing else —
# daily-news-and-commit.sh commits with a NEWS/ pathspec, so that is a guarantee
# rather than a habit — and that content clears validate:news three times before
# it is ever served: in `pnpm build` before the commit, in the pre-push hook, and
# again in Vercel's prebuild. Running this on it would spend ten minutes of CI a
# day re-checking the same files. Pushes that touch code still run.
name: gate

on:
  push:
    branches: [main]
    paths-ignore:
      - "NEWS/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # reads pnpm version from package.json "packageManager"
      - uses: actions/setup-node@v7
        with:
          # .nvmrc is the one place the Node major lives: `nvm use` reads it
          # locally, this reads it in CI, and it is set to the Vercel project's
          # version, so the gate validates the runtime production builds on.
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm prepush

  # Separate job, not a step in `gate`: a leaked credential is a different
  # emergency from a failing test, and it must not sit behind one in the log or
  # be skipped because the other failed first.
  #
  # This is the backstop, not the front line. The repository is public, so
  # GitHub's own secret scanning with push protection refuses the push at the
  # server before a key can ever reach a commit — enable it in
  # Settings → Code security. gitleaks runs after the fact and catches the
  # shapes GitHub does not know.
  #
  # No GITLEAKS_LICENSE: it is required for organization accounts only, and this
  # repository belongs to a personal one.
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # gitleaks scans history, which a shallow clone does not have
      - uses: gitleaks/gitleaks-action@v3
